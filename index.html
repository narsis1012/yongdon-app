<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용돈 기록장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1B2A41">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="용돈">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFF5; --surface:#FFFFFF; --ink:#1B2A41; --muted:#5E6B7E; --line:#D3DCE6;
  --coin:#F2B705; --coin-ink:#3A2C00; --spend:#D6404A; --ok:#1F8A5B;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161D; --surface:#1B232E; --ink:#E7ECF2; --muted:#9AA7B8; --line:#2C3644;
    --coin:#F5C431; --coin-ink:#2A2000; --spend:#FF6B73; --ok:#4CC48A; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{display:flex;align-items:center;gap:2px}
.month h1{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:1.45rem;margin:0;min-width:7.2em;text-align:center}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:1.4rem;width:40px;height:40px;border-radius:50%;cursor:pointer}
.icon-btn:hover{background:var(--surface)}
.tools{display:flex;gap:0}
.tools .icon-btn{font-size:1.1rem}
.jar{margin-top:14px;background:var(--coin);color:var(--coin-ink);border-radius:28px 28px 20px 20px;padding:20px 22px 16px}
.jar .lbl{font-size:.95rem;opacity:.85}
.jar .big{font-family:"Jua",system-ui,sans-serif;font-size:clamp(2.6rem,12vw,3.4rem);line-height:1.1;margin:2px 0 12px;word-break:keep-all}
.jar .big.neg{color:#8E0F18}
.calc{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:.92rem;border-top:1.5px dashed rgba(0,0,0,.25);padding-top:10px}
.calc span:nth-child(even){text-align:right;font-weight:600}
form.add{margin-top:16px;background:var(--surface);border-radius:20px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:8px;border-radius:9px;color:var(--muted);font-weight:500}
.seg input:checked+span{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input[value=in]:checked+span{color:var(--ok)}
.seg input[value=out]:checked+span{color:var(--spend)}
.seg input:focus-visible+span{outline:2px solid var(--coin)}
.amt{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg)}
.amt:focus-within{border-color:var(--ink)}
.amt input{flex:1;border:0;background:transparent;color:var(--ink);font-family:"Jua",system-ui,sans-serif;font-size:1.7rem;padding:10px 0;min-width:0;outline:none}
.amt span{color:var(--muted);font-size:1.1rem}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{cursor:pointer}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:inline-block;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.92rem;color:var(--muted)}
.cats input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.cats input:focus-visible+span{outline:2px solid var(--coin);outline-offset:2px}
.line2{display:flex;gap:8px}
.line2 input{flex:1;min-width:0}
input.txt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--ink);width:100%}
input.txt:focus{outline:none;border-color:var(--ink)}
.line2 input[type=date].txt{flex:0 0 auto;width:9.5em}
.primary{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:1.05rem;background:var(--ink);color:var(--surface);cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.ghost{border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:transparent;color:var(--ink);cursor:pointer}
.danger{border:0;border-radius:14px;padding:12px;font:inherit;background:transparent;color:var(--spend);cursor:pointer;font-weight:600}
button:focus-visible{outline:2px solid var(--coin);outline-offset:2px}
.list{margin-top:20px}
.day{margin-top:18px}
.day h2{font-size:.9rem;font-weight:500;color:var(--muted);margin:0 0 4px}
.item{display:flex;align-items:center;gap:12px;padding:12px 6px;border:0;border-bottom:1px solid var(--line);width:100%;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.item:hover{background:var(--surface)}
.dot{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}
.item:hover .dot{background:var(--bg)}
.item .mid{flex:1;min-width:0}
.item .memo{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .who{font-size:.8rem;color:var(--muted)}
.item .price{font-family:"Jua",system-ui,sans-serif;font-size:1.15rem;white-space:nowrap}
.price.out{color:var(--spend)} .price.in{color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:14px}
.note{font-size:.85rem;color:var(--muted);text-align:center;margin-top:10px;min-height:1.2em}
.note.err{color:var(--spend)}
dialog{border:0;border-radius:20px;padding:20px;background:var(--surface);color:var(--ink);width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px;font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:1.3rem}
dialog p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
dialog .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.fld{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
dialog .btns{display:flex;gap:8px;margin-top:14px}
dialog .btns button{flex:1}
dialog hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:24px;overflow:auto}
#lock[hidden]{display:none}
.lockbox{width:min(100%,320px);text-align:center;display:grid;gap:10px}
.lockbox .coin{width:84px;height:84px;border-radius:50%;background:var(--coin);margin:0 auto 4px;display:grid;place-items:center;font-size:2.2rem}
.lockbox h2{font-family:"Jua",system-ui,sans-serif;font-weight:400;font-size:1.6rem;margin:0}
.lockbox p{color:var(--muted);margin:0 0 6px;font-size:.92rem}
.lockbox input.txt{text-align:center;font-size:1.3rem;letter-spacing:.25em}
.lockbox input.txt::placeholder{letter-spacing:0;font-size:1rem}
.remember{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.9rem;color:var(--muted)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
.status{display:flex;justify-content:center;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);background:var(--surface);border-radius:999px;padding:4px 12px;border:0;font-family:inherit;cursor:pointer}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.pill.wait i{background:var(--coin)} .pill.off i{background:var(--muted)} .pill.err i{background:var(--spend)}
#installBtn{font-size:.85rem;width:auto;padding:0 10px;border-radius:999px;color:var(--ink);background:var(--surface)}
</style>
</head>
<body>
<div id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="coin" aria-hidden="true"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:50%"></div>
    <h2>용돈 기록장</h2>
    <p id="lockMsg">불러오는 중…</p>
    <input class="txt" id="apiIn" type="url" placeholder="https://script.google.com/macros/s/…/exec" aria-label="서버 주소" hidden style="letter-spacing:0;font-size:.9rem;text-align:left">
    <input class="txt" id="pinIn" type="password" inputmode="numeric" placeholder="비밀번호" aria-label="비밀번호" hidden>
    <input class="txt" id="pinIn2" type="password" inputmode="numeric" placeholder="비밀번호 한 번 더" aria-label="비밀번호 확인" hidden>
    <input class="txt" id="nameIn" maxlength="10" placeholder="내 이름 (예: 민지)" aria-label="이 기기에서 쓸 이름" hidden style="letter-spacing:0">
    <label class="remember" id="remWrap" hidden><input type="checkbox" id="remember" checked> 이 기기에서 기억하기</label>
    <button class="primary" id="pinBtn" type="submit" hidden>열기</button>
    <button class="ghost" id="retryBtn" type="button" hidden>다시 시도</button>
    <button class="ghost" id="apiReset" type="button" hidden>서버 주소 다시 입력</button>
  </form>
</div>

<div class="wrap">
  <div class="top">
    <div class="month">
      <button class="icon-btn" id="prev" aria-label="이전 달">‹</button>
      <h1 id="monthTitle">—</h1>
      <button class="icon-btn" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="tools">
      <button class="icon-btn" id="installBtn" hidden>앱 설치</button>
      <button class="icon-btn" id="lockBtn" aria-label="잠그기" title="잠그기">🔒</button>
      <button class="icon-btn" id="setBtn" aria-label="설정" title="설정">⚙️</button>
    </div>
  </div>
  <div class="status"><button class="pill" id="pill" type="button" title="지금 동기화"><i></i><span id="pillTxt">준비 중</span></button></div>

  <section class="jar" aria-live="polite">
    <div class="lbl" id="jarLbl">지금 남은 용돈 (누적)</div>
    <div class="big" id="remain">0원</div>
    <div class="calc" id="calc"></div>
  </section>

  <form class="add" id="addForm" autocomplete="off">
    <div class="seg" role="radiogroup" aria-label="종류">
      <label><input type="radio" name="kind" value="out" checked><span>쓴 돈</span></label>
      <label><input type="radio" name="kind" value="in"><span>받은 돈</span></label>
    </div>
    <div class="amt"><input id="amount" inputmode="numeric" placeholder="금액" aria-label="금액"><span>원</span></div>
    <div class="cats" id="cats"></div>
    <div class="line2">
      <input class="txt" id="memo" placeholder="메모 (예: 떡볶이)" maxlength="40" aria-label="메모">
      <input class="txt" id="date" type="date" aria-label="날짜">
    </div>
    <button class="primary" id="addBtn" type="submit">기록하기</button>
  </form>
  <div class="note" id="note"></div>
  <div class="list" id="list"></div>
  <div class="hint">기록을 누르면 고치거나 지울 수 있어요. 인터넷이 없어도 기록되고, 연결되면 자동으로 공유돼요.</div>
</div>

<dialog id="editDlg">
  <form id="editForm" autocomplete="off">
    <h3>기록 고치기</h3>
    <div class="grid">
      <div class="seg" role="radiogroup" aria-label="종류">
        <label><input type="radio" name="ekind" value="out"><span>쓴 돈</span></label>
        <label><input type="radio" name="ekind" value="in"><span>받은 돈</span></label>
      </div>
      <div class="amt"><input id="eAmount" inputmode="numeric" aria-label="금액"><span>원</span></div>
      <div class="cats" id="eCats"></div>
      <input class="txt" id="eMemo" maxlength="40" placeholder="메모" aria-label="메모">
      <input class="txt" id="eDate" type="date" aria-label="날짜">
    </div>
    <div class="btns">
      <button class="danger" type="button" id="eDel">삭제</button>
      <button class="ghost" type="button" id="eCancel">취소</button>
      <button class="primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<dialog id="setDlg">
  <form id="setForm" autocomplete="off">
    <h3>설정</h3>
    <div class="grid">
      <label class="fld">매달 받는 용돈 (함께 쓰는 사람과 공통)
        <div class="amt"><input id="sBudget" inputmode="numeric" placeholder="예: 100,000"><span>원</span></div>
      </label>
      <label class="fld">용돈 시작한 달 (이 달부터 매달 쌓여요)
        <input class="txt" id="sStart" type="month">
      </label>
      <label class="fld">이 기기에서 쓰는 이름
        <input class="txt" id="sName" maxlength="10" placeholder="예: 민지">
      </label>
    </div>
    <hr>
    <div class="grid">
      <label class="fld">비밀번호 바꾸기 (인터넷 연결 필요, 숫자 4~12자리)
        <input class="txt" id="sPin" type="password" inputmode="numeric" placeholder="새 비밀번호 (바꿀 때만 입력)">
      </label>
      <input class="txt" id="sPin2" type="password" inputmode="numeric" placeholder="새 비밀번호 한 번 더" aria-label="새 비밀번호 확인">
      <label class="fld">서버 주소
        <input class="txt" id="sApi" type="url" style="font-size:.85rem">
      </label>
    </div>
    <div class="note err" id="sNote"></div>
    <div class="btns">
      <button class="ghost" type="button" id="sCancel">취소</button>
      <button class="primary" type="submit" id="sSave">저장</button>
    </div>
  </form>
</dialog>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
